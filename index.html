<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angle Pair Hunter</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg1:#1e1b4b; --bg2:#312e81; --card:#ffffff; --ink:#1e1b2e; --accent:#f97316;
  --line:#0ea5e9; --good:#16a34a; --bad:#dc2626; --muted:#6b7280;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --card:#1f2937; --ink:#f3f4f6; --muted:#9ca3af; } }
:root[data-theme="dark"]{ --card:#1f2937; --ink:#f3f4f6; --muted:#9ca3af; }
*{box-sizing:border-box;}
#bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block;}
html,body{height:100%;}
body{
  margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:linear-gradient(135deg,var(--bg1),var(--bg2));
  min-height:100%; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex; justify-content:center; padding-left:12px; padding-right:12px;
}
.wrap{width:100%; max-width:760px; padding:20px 0 40px;position:relative;z-index:1;}
h1{color:#fff; text-align:center; font-size:1.5rem; margin-bottom:4px;}
.sub{color:#c7d2fe; text-align:center; margin-bottom:16px; font-size:.9rem;}
.card{background:var(--card); color:var(--ink); border-radius:16px; padding:18px; box-shadow:0 10px 30px rgba(0,0,0,.35);}
.stats{display:flex; justify-content:space-between; font-weight:600; margin-bottom:10px; font-size:.9rem;}
#stage{width:100%;height:150px;border-radius:12px;background:radial-gradient(circle at 50% 30%,#eef2ff,#e0e7ff);display:block;margin-bottom:6px;}
.hint{text-align:center;font-size:.72rem;color:var(--muted);margin-bottom:8px;}
svg{width:100%; height:auto; display:block; margin:6px auto 14px; max-width:340px;}
.q{font-size:1.05rem; font-weight:600; margin:10px 0;}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
button.opt{padding:12px; border-radius:10px; border:2px solid #d1d5db; background:transparent; color:var(--ink); font-size:1rem; cursor:pointer; transition:.15s;}
button.opt:hover{border-color:var(--accent);}
button.opt.correct{background:var(--good); border-color:var(--good); color:#fff;}
button.opt.wrong{background:var(--bad); border-color:var(--bad); color:#fff;}
.feedback{min-height:26px; margin-top:10px; font-weight:600;}
.next{margin-top:14px; padding:10px 18px; border-radius:10px; border:none; background:var(--accent); color:#fff; font-weight:700; cursor:pointer; display:none;}
.done{text-align:center; padding:20px;}
.restart{margin-top:12px; padding:10px 20px; border-radius:10px; border:none; background:var(--line); color:#fff; font-weight:700; cursor:pointer;}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="wrap">
<h1>📐 Angle Pair Hunter</h1>
<div class="sub">Parallel lines, a transversal, and the angles it makes. Find the missing measures!</div>
<div class="card" id="card">
  <div class="stats"><span id="progress">Question 1</span><span id="score">Score: 0</span></div>
  <canvas id="stage"></canvas>
  <div class="hint">The 3D model above shows the same setup: two parallel planes sliced by a tilted transversal plane. Drag to spin it.</div>
  <svg viewBox="0 0 420 340" id="diagram"></svg>
  <div class="q" id="question"></div>
  <div class="opts" id="opts"></div>
  <div class="feedback" id="feedback"></div>
  <button class="next" id="nextBtn">Next ▶</button>
</div>
</div>
<script>

// ---------- animated 3D background ----------
(function(){
  const canvas=document.getElementById('bgCanvas');
  if(!canvas || typeof THREE==='undefined') return;
  const bgRenderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  bgRenderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  bgRenderer.setSize(window.innerWidth,window.innerHeight);
  const bgScene=new THREE.Scene();
  const bgCam=new THREE.PerspectiveCamera(55,window.innerWidth/window.innerHeight,0.1,100);
  bgCam.position.set(0,0,9);
  const bl=new THREE.DirectionalLight(0xffffff,1.1); bl.position.set(5,6,7); bgScene.add(bl);
  bgScene.add(new THREE.AmbientLight(0xffffff,0.55));
  const colors=[0xf97316,0xea5e9];
  const geos=[
    new THREE.IcosahedronGeometry(1,0),
    new THREE.TorusGeometry(0.7,0.24,10,26),
    new THREE.OctahedronGeometry(1,0),
    new THREE.TetrahedronGeometry(1.05,0),
    new THREE.TorusKnotGeometry(0.55,0.16,64,8)
  ];
  const shapes=[];
  const count = window.innerWidth<520? 7 : 12;
  for(let i=0;i<count;i++){
    const geo=geos[i%geos.length];
    const wire=i%2===0;
    const mat=new THREE.MeshStandardMaterial({color:colors[i%colors.length],wireframe:wire,transparent:true,opacity:wire?0.35:0.16,roughness:0.55,metalness:0.1});
    const mesh=new THREE.Mesh(geo,mat);
    const scl=0.5+Math.random()*0.9;
    mesh.scale.set(scl,scl,scl);
    mesh.position.set((Math.random()-0.5)*16,(Math.random()-0.5)*16,(Math.random()-0.5)*10-3);
    mesh.rotation.set(Math.random()*Math.PI*2,Math.random()*Math.PI*2,Math.random()*Math.PI*2);
    mesh.userData.rot={x:(Math.random()-0.5)*0.006,y:(Math.random()-0.5)*0.007};
    mesh.userData.driftY=(Math.random()*0.006+0.002)*(Math.random()<0.5?1:-1);
    bgScene.add(mesh); shapes.push(mesh);
  }
  function resizeBg(){ bgRenderer.setSize(window.innerWidth,window.innerHeight); bgCam.aspect=window.innerWidth/window.innerHeight; bgCam.updateProjectionMatrix(); }
  window.addEventListener('resize',resizeBg);
  function animateBg(){
    requestAnimationFrame(animateBg);
    shapes.forEach(s=>{
      s.rotation.x+=s.userData.rot.x; s.rotation.y+=s.userData.rot.y;
      s.position.y+=s.userData.driftY;
      if(s.position.y>9) s.position.y=-9; if(s.position.y<-9) s.position.y=9;
    });
    bgCam.position.x = Math.sin(Date.now()*0.00007)*1.5;
    bgCam.lookAt(0,0,0);
    bgRenderer.render(bgScene,bgCam);
  }
  animateBg();
})();
// ---------- three.js decorative 3D model of two parallel planes + transversal ----------
let renderer, scene, camera, group, dragging=false, lastX=0, lastY=0;
function initThree(){
  const canvas=document.getElementById('stage');
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(45,1,0.1,100);
  camera.position.set(0,1.4,4.2);
  const light=new THREE.DirectionalLight(0xffffff,1.1); light.position.set(3,5,4); scene.add(light);
  scene.add(new THREE.AmbientLight(0xffffff,0.8));
  group=new THREE.Group(); group.rotation.x=-0.3; group.rotation.y=0.5; scene.add(group);
  const planeGeo=new THREE.PlaneGeometry(2.6,1.4);
  const lineMat=new THREE.MeshStandardMaterial({color:0x0ea5e9,transparent:true,opacity:0.55,side:THREE.DoubleSide});
  const p1=new THREE.Mesh(planeGeo,lineMat); p1.position.y=0.7; p1.rotation.x=Math.PI/2; group.add(p1);
  const p2=new THREE.Mesh(planeGeo,lineMat.clone()); p2.position.y=-0.7; p2.rotation.x=Math.PI/2; group.add(p2);
  const transMat=new THREE.MeshStandardMaterial({color:0xf97316,transparent:true,opacity:0.6,side:THREE.DoubleSide});
  const trans=new THREE.Mesh(new THREE.PlaneGeometry(1.1,3),transMat);
  trans.rotation.z=0.5; group.add(trans);
  resize(); window.addEventListener('resize',resize);
  canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.style.cursor='grabbing';});
  window.addEventListener('pointerup',()=>{dragging=false;canvas.style.cursor='grab';});
  window.addEventListener('pointermove',e=>{ if(!dragging)return; group.rotation.y+=(e.clientX-lastX)*0.012; group.rotation.x+=(e.clientY-lastY)*0.012; lastX=e.clientX; lastY=e.clientY; });
  animate();
}
function resize(){ const canvas=document.getElementById('stage'); if(!canvas)return; const w=canvas.clientWidth||400,h=150; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
function animate(){ requestAnimationFrame(animate); if(group && !dragging) group.rotation.y+=0.004; renderer.render(scene,camera); }

const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById('diagram');
const P1={x:60,y:110}, P2={x:340,y:230};
function drawDiagram(givenIdx,givenVal){
  svg.innerHTML="";
  function line(x1,y1,x2,y2,color){const l=document.createElementNS(NS,'line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.setAttribute('stroke',color);l.setAttribute('stroke-width',3);svg.appendChild(l);}
  line(10,110,410,110,'#0ea5e9');
  line(10,230,410,230,'#0ea5e9');
  line(20,20,380,320,'#f97316');
  const labels=[
    {n:1,x:P1.x-32,y:P1.y-14},{n:2,x:P1.x+18,y:P1.y-14},
    {n:3,x:P1.x+18,y:P1.y+26},{n:4,x:P1.x-32,y:P1.y+26},
    {n:5,x:P2.x-32,y:P2.y-14},{n:6,x:P2.x+18,y:P2.y-14},
    {n:7,x:P2.x+18,y:P2.y+26},{n:8,x:P2.x-32,y:P2.y+26}
  ];
  labels.forEach(l=>{
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',l.x);c.setAttribute('cy',l.y);c.setAttribute('r',13);
    c.setAttribute('fill', l.n===givenIdx? '#f97316':'#e0e7ff');
    svg.appendChild(c);
    const t=document.createElementNS(NS,'text');
    t.setAttribute('x',l.x);t.setAttribute('y',l.y+4);t.setAttribute('text-anchor','middle');
    t.setAttribute('font-size','12'); t.setAttribute('font-weight','700');
    t.setAttribute('fill', l.n===givenIdx? '#fff':'#312e81');
    t.textContent = l.n===givenIdx? givenVal+'°' : l.n;
    svg.appendChild(t);
  });
}
function computeAngles(base){
  const a={};
  a[1]=base; a[3]=base; a[6]=base; a[8]=base;
  a[2]=180-base; a[4]=180-base; a[5]=180-base; a[7]=180-base;
  return a;
}
function relationName(x,y){
  const vert=[[1,3],[2,4],[5,7],[6,8]];
  const corr=[[1,5],[2,6],[3,7],[4,8]];
  const altInt=[[3,6],[4,5]];
  const altExt=[[1,8],[2,7]];
  const coInt=[[3,5],[4,6]];
  const adj=[[1,2],[2,3],[3,4],[4,1],[5,6],[6,7],[7,8],[8,5]];
  const has=(arr)=>arr.some(p=>(p[0]===x&&p[1]===y)||(p[0]===y&&p[1]===x));
  if(has(vert))return"vertically opposite";
  if(has(corr))return"corresponding";
  if(has(altInt))return"alternate interior";
  if(has(altExt))return"alternate exterior";
  if(has(coInt))return"co-interior (supplementary)";
  if(has(adj))return"adjacent (linear pair)";
  return"unrelated";
}
let base, angles, qIndex=0, score=0, questions=[];
function buildQuestions(){
  questions=[];
  const askAngles=[3,5,6,8,2];
  askAngles.forEach(n=>{ questions.push({type:'value',target:n}); });
  questions.push({type:'relation',pair:[3,6]});
  questions.push({type:'relation',pair:[1,5]});
  questions.push({type:'relation',pair:[4,6]});
}
function newGame(){
  base = [45,50,55,60,65,70,75,80,85,100,110,120,125,130][Math.floor(Math.random()*14)];
  angles = computeAngles(base);
  buildQuestions();
  qIndex=0; score=0;
  document.getElementById('nextBtn').style.display='none';
  render();
}
function render(){
  if(qIndex>=questions.length){ showDone(); return; }
  const q=questions[qIndex];
  document.getElementById('progress').textContent=`Question ${qIndex+1} of ${questions.length}`;
  document.getElementById('score').textContent=`Score: ${score}`;
  drawDiagram(1, base);
  const qEl=document.getElementById('question');
  const optsEl=document.getElementById('opts');
  optsEl.innerHTML=''; document.getElementById('feedback').textContent='';
  document.getElementById('nextBtn').style.display='none';
  let correct, opts;
  if(q.type==='value'){
    qEl.textContent=`∠1 = ${base}°. What is the measure of ∠${q.target}?`;
    correct=angles[q.target];
    const set=new Set([correct]);
    while(set.size<4){ set.add(Math.max(5,Math.min(175, correct + (Math.floor(Math.random()*7)-3)*5))); }
    opts=Array.from(set).sort(()=>Math.random()-0.5);
  } else {
    qEl.textContent=`How would you describe the relationship between ∠${q.pair[0]} and ∠${q.pair[1]}?`;
    correct=relationName(q.pair[0],q.pair[1]);
    const all=["vertically opposite","corresponding","alternate interior","alternate exterior","co-interior (supplementary)","adjacent (linear pair)"];
    const set=new Set([correct]);
    while(set.size<4){ set.add(all[Math.floor(Math.random()*all.length)]); }
    opts=Array.from(set).sort(()=>Math.random()-0.5);
  }
  opts.forEach(opt=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent = q.type==='value'? opt+'°' : opt;
    b.onclick=()=>answer(b,opt,correct,q.type);
    optsEl.appendChild(b);
  });
}
function answer(btn,chosen,correct,type){
  const buttons=document.querySelectorAll('.opt');
  buttons.forEach(b=>b.disabled=true);
  const isRight = type==='value'? chosen===correct : chosen===correct;
  if(isRight){ btn.classList.add('correct'); score++; document.getElementById('feedback').textContent='✅ Correct!'; document.getElementById('feedback').style.color='var(--good)';}
  else{
    btn.classList.add('wrong');
    buttons.forEach(b=>{ if((type==='value'? (b.textContent===correct+'°') : (b.textContent===correct))) b.classList.add('correct'); });
    document.getElementById('feedback').textContent=`❌ Not quite — correct answer: ${type==='value'?correct+'°':correct}`;
    document.getElementById('feedback').style.color='var(--bad)';
  }
  document.getElementById('score').textContent=`Score: ${score}`;
  document.getElementById('nextBtn').style.display='inline-block';
}
document.getElementById('nextBtn').onclick=()=>{ qIndex++; render(); };
function showDone(){
  document.getElementById('card').innerHTML=`<div class="done"><h2>🏁 Done!</h2><p>You scored <b>${score} / ${questions.length}</b></p>
  <p style="color:var(--muted);font-size:.9rem;">Covers: transversal angle types — adjacent, vertically opposite, corresponding, alternate, co-interior.</p>
  <button class="restart" onclick="location.reload()">Play Again</button></div>`;
}
initThree();
newGame();
</script>
</body>
</html>
